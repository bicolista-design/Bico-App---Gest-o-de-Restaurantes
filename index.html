
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    
    <!-- Meta tags para comportamento de App Nativo -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4f46e5">
    <meta name="application-name" content="BicoApp">
    <meta name="apple-mobile-web-app-title" content="BicoApp">
    
    <!-- Ícones para Apple -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3448/3448609.png">
    
    <title>Bico App - Gestão Restô</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
          /* Variáveis de Safe Area para lidar com Notches de celulares Android/iPhone */
          --safe-area-top: env(safe-area-inset-top, 0px);
          --safe-area-bottom: env(safe-area-inset-bottom, 0px);
          --safe-area-left: env(safe-area-inset-left, 0px);
          --safe-area-right: env(safe-area-inset-right, 0px);
          
          --brand-primary: #4f46e5;
          --brand-secondary: #10b981;
          --brand-accent: #f59e0b;
          --brand-text-on-primary: #ffffff;
        }
        
        body { 
          font-family: 'Inter', sans-serif; 
          -webkit-tap-highlight-color: transparent;
          -webkit-touch-callout: none;
          -webkit-user-select: none;
          user-select: none;
          touch-action: manipulation;
          background-color: #f8fafc;
          overflow: hidden;
          height: 100vh; 
          width: 100vw;
          position: fixed;
          overscroll-behavior: none;
          /* Respeita o notch nas laterais em modo paisagem */
          padding-left: var(--safe-area-left);
          padding-right: var(--safe-area-right);
        }
        
        #root { 
          height: 100%; 
          width: 100%; 
          display: flex; 
          flex-direction: column; 
          /* Garante que o conteúdo não fique sob o notch ou barra de navegação */
          padding-top: var(--safe-area-top);
          padding-bottom: var(--safe-area-bottom);
        }

        /* Classes Utilitárias */
        .pt-safe { padding-top: var(--safe-area-top); }
        .pb-safe { padding-bottom: var(--safe-area-bottom); }
        .bg-brand-primary { background-color: var(--brand-primary); color: var(--brand-text-on-primary); }
        .text-brand-primary { color: var(--brand-primary); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        /* Ajustes de Performance de UI */
        * { transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease; }
        
        /* Impede zoom acidental em inputs no iOS */
        input, select, textarea { font-size: 16px !important; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "recharts": "https://esm.sh/recharts@^3.6.0"
      }
    }
    </script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script>
        // Registro do Service Worker otimizado para APK
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                .then(reg => console.log('SW: Ativo para modo offline/APK'))
                .catch(err => console.log('SW: Erro no registro', err));
            });
        }
    </script>
</body>
</html>
